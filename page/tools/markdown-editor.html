<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown 工作台 · MinOS-WJ</title><style>
:root{--bg:#f4f6f8;--panel:#fff;--line:#d9e0e7;--text:#1f2937;--muted:#667085;--brand:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top a{color:var(--brand);text-decoration:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.toolbar button{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);padding:9px 14px;cursor:pointer}.toolbar button.primary{background:var(--brand);border-color:var(--brand);color:#fff}.status{color:var(--muted);font-size:13px;align-self:center}.layout{display:grid;grid-template-columns:1fr 1fr;gap:15px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.panel h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600}textarea{width:100%;min-height:500px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:#fbfcfd;color:var(--text);padding:14px;font:14px/1.7 ui-monospace,Consolas,monospace;outline:none}textarea:focus{border-color:var(--brand)}.preview{min-height:500px;line-height:1.8;overflow:auto}.preview h1,.preview h2,.preview h3{line-height:1.3}.preview code{background:#eef2f7;padding:2px 5px;border-radius:4px}.preview pre{background:#f3f4f6;padding:12px;border-radius:8px;overflow:auto}@media(max-width:800px){.layout{grid-template-columns:1fr}textarea,.preview{min-height:360px}}
</style><link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="manifest" href="../../site.webmanifest">
</head><body><div class="wrap"><div class="top"><a href="index-markdown.html">← 返回工作台</a><strong>Markdown 工作台</strong></div><div class="toolbar"><button class="primary" id="previewBtn">实时预览</button><button id="mergeBtn">合并文本</button><button id="txtBtn">导出 TXT</button><button id="mdBtn">导出 Markdown</button><button id="clearBtn">清空</button><span class="status" id="status">本地编辑，不上传内容</span></div><div class="layout"><section class="panel"><h2>编辑区</h2><textarea id="input" spellcheck="false" placeholder="# 标题&#10;&#10;输入 Markdown 内容…"># MinOS-WJ 工作台&#10;&#10;这是一个支持 **预览、合并和导出** 的 Markdown 工具集。&#10;&#10;- 所有内容只在浏览器中处理&#10;- 可直接导出 TXT 或 Markdown</textarea></section><section class="panel"><h2>预览</h2><article class="preview" id="preview"></article></section></div></div><script>
const input=document.querySelector('#input'),preview=document.querySelector('#preview'),status=document.querySelector('#status');function escape(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}function render(){let html=escape(input.value).replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(new RegExp(String.fromCharCode(96)+'([^'+String.fromCharCode(96)+']+)'+String.fromCharCode(96),'g'),'<code>$1</code>').replace(/^[-*] (.*)$/gm,'<li>$1</li>').replace(/(?:<li>.*<\/li>\n?)+/g,m=>'<ul>'+m+'</ul>').replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');preview.innerHTML='<p>'+html+'</p>';status.textContent=input.value.length+' 字符 · 已更新';}function download(name,type,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href);}document.querySelector('#previewBtn').onclick=render;document.querySelector('#txtBtn').onclick=()=>download('minos-export.txt','text/plain;charset=utf-8',input.value.replace(/[#*_]/g,''));document.querySelector('#mdBtn').onclick=()=>download('minos-export.md','text/markdown;charset=utf-8',input.value);document.querySelector('#mergeBtn').onclick=()=>{const extra=prompt('粘贴要合并的 Markdown 文本：');if(extra){input.value=input.value.trim()+'\n\n---\n\n'+extra.trim();render();}};document.querySelector('#clearBtn').onclick=()=>{input.value='';render();input.focus();};input.addEventListener('input',render);render();
</script></body></html>
