<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unicode 工具</title><style>:root{--bg:#f5f7fa;--line:#dfe4ea;--text:#1f2937;--brand:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:800px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between}.top a{color:var(--brand);text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:24px}textarea{width:100%;min-height:220px;padding:12px;border:1px solid var(--line);border-radius:8px;font:14px monospace}button{padding:9px 13px;border:1px solid var(--line);background:#fff;border-radius:8px;margin:10px 8px 0 0;cursor:pointer}button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.result{margin-top:12px;background:#f3f4f6;padding:12px;white-space:pre-wrap;word-break:break-all}</style><link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="manifest" href="../../site.webmanifest">
</head><body><main class="wrap"><div class="top"><a href="index-crypto.html">← 返回加解密工具集</a><strong>Unicode</strong></div><section class="panel"><textarea id="input" placeholder="输入文本或 \\uXXXX"></textarea><br><button class="primary" id="encode">编码</button><button id="decode">解码</button><div class="result" id="result"></div></section></main><script>const i=document.querySelector('#input'),r=document.querySelector('#result');document.querySelector('#encode').onclick=()=>r.textContent=[...i.value].map(c=>'\\\\u'+c.charCodeAt(0).toString(16).padStart(4,'0')).join('');document.querySelector('#decode').onclick=()=>r.textContent=i.value.replace(/\\\\u([0-9a-f]{4})/gi,(_,h)=>String.fromCharCode(parseInt(h,16)));</script></body></html>
