<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网络环境</title><style>:root{--bg:#f5f7fa;--line:#dfe4ea;--text:#1f2937;--muted:#667085;--brand:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between}.top a{color:var(--brand);text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{padding:12px;background:#f3f4f6;border-radius:8px}.item b{display:block;font-size:12px;color:var(--muted);font-weight:500}.item span{display:block;margin-top:4px;word-break:break-all}button{padding:9px 13px;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;margin-top:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><a href="index-network.html">← 返回网络工具集</a><strong>网络环境</strong></div><section class="panel"><div class="grid"><div class="item"><b>浏览器在线状态</b><span id="online">检测中</span></div><div class="item"><b>连接类型</b><span id="connection">不可用</span></div><div class="item"><b>时区</b><span id="timezone">检测中</span></div><div class="item"><b>语言</b><span id="language">检测中</span></div><div class="item"><b>出口 IP</b><span id="ip">检测中</span></div><div class="item"><b>VPN / 代理提示</b><span id="vpn">无法仅凭网页确认</span></div></div><button id="refresh">重新检测</button></section></main><script>async function load(){document.querySelector('#online').textContent=navigator.onLine?'在线':'离线';const c=navigator.connection;document.querySelector('#connection').textContent=c?(c.effectiveType+' · '+(c.downlink||'?')+' Mbps'):'浏览器未提供';document.querySelector('#timezone').textContent=Intl.DateTimeFormat().resolvedOptions().timeZone;document.querySelector('#language').textContent=navigator.language;if(!navigator.onLine){document.querySelector('#ip').textContent='离线';return;}try{const r=await fetch('https://api.ipify.org?format=json');document.querySelector('#ip').textContent=(await r.json()).ip;}catch{document.querySelector('#ip').textContent='获取失败';}}load();document.querySelector('#refresh').onclick=load;</script></body></html>
