<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>搜索引擎入口 · MinOS-WJ</title><style>:root{--bg:#f5f7fa;--panel:#fff;--line:#dfe4ea;--text:#1f2937;--muted:#667085;--brand:#2563eb;--soft:#eef4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}.top a{color:var(--brand);text-decoration:none}.intro{padding:38px 0 22px}.intro h1{margin:0 0 6px;font-size:30px}.intro p{margin:0;color:var(--muted)}.query{display:flex;gap:8px;margin-bottom:16px}.query input{flex:1;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font:inherit}.query button{padding:10px 16px;background:var(--brand);border:1px solid var(--brand);border-radius:8px;color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:17px}.card h2{font-size:17px;margin:0 0 5px}.card p{font-size:13px;color:var(--muted);margin:0 0 14px}.card a{color:var(--brand);text-decoration:none;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="top"><a href="index.html">← 返回工具集</a><strong>搜索引擎入口</strong></header><section class="intro"><h1>搜索引擎</h1><p>输入关键词后选择搜索引擎，或直接打开站点。</p></section><form id="form" class="query"><input id="q" placeholder="输入搜索关键词…" autocomplete="off"><button>搜索</button></form><div class="grid"><article class="card"><h2>百度</h2><p>中文网页、资讯与本地内容。</p><a data-engine="https://www.baidu.com/s?wd=" href="https://www.baidu.com" target="_blank" rel="noreferrer">百度搜索 →</a></article><article class="card"><h2>Bing</h2><p>综合网页与国际搜索。</p><a data-engine="https://www.bing.com/search?q=" href="https://www.bing.com" target="_blank" rel="noreferrer">Bing 搜索 →</a></article><article class="card"><h2>Google</h2><p>全球网页与学术入口。</p><a data-engine="https://www.google.com/search?q=" href="https://www.google.com" target="_blank" rel="noreferrer">Google 搜索 →</a></article><article class="card"><h2>DuckDuckGo</h2><p>注重隐私的搜索选择。</p><a data-engine="https://duckduckgo.com/?q=" href="https://duckduckgo.com" target="_blank" rel="noreferrer">DuckDuckGo →</a></article><article class="card"><h2>Yandex</h2><p>俄语区与国际搜索。</p><a data-engine="https://yandex.com/search/?text=" href="https://yandex.com" target="_blank" rel="noreferrer">Yandex →</a></article><article class="card"><h2>GitHub</h2><p>代码、项目与开发文档。</p><a data-engine="https://github.com/search?q=" href="https://github.com" target="_blank" rel="noreferrer">GitHub 搜索 →</a></article></div></main><script>document.querySelector('#form').onsubmit=e=>{e.preventDefault();const q=document.querySelector('#q').value.trim();if(!q)return;const a=document.querySelector('a[data-engine]');window.open(a.dataset.engine+encodeURIComponent(q),'_blank','noopener');};document.querySelectorAll('a[data-engine]').forEach(a=>a.onclick=e=>{const q=document.querySelector('#q').value.trim();if(q){e.preventDefault();window.open(a.dataset.engine+encodeURIComponent(q),'_blank','noopener');}});</script></body></html>
