<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown 合并</title><style>:root{--bg:#f5f7fa;--panel:#fff;--line:#dfe4ea;--text:#1f2937;--muted:#667085;--brand:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between}.top a{color:var(--brand);text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:24px}textarea{width:100%;min-height:360px;border:1px solid var(--line);border-radius:8px;padding:12px;font:14px/1.7 monospace;resize:vertical}button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 13px;margin:10px 8px 0 0;cursor:pointer}button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.hint{color:var(--muted);font-size:13px}</style></head><body><main class="wrap"><div class="top"><a href="index-markdown.html">← 返回 Markdown 工具集</a><strong>Markdown 合并</strong></div><section class="panel"><p class="hint">每段内容用分隔线分开，点击后合并为一个文档。</p><textarea id="input" placeholder="粘贴多段 Markdown 文本…"></textarea><br><button class="primary" id="merge">整理并合并</button><button id="download">下载 Markdown</button><div class="hint" id="status"></div></section></main><script>const input=document.querySelector('#input');document.querySelector('#merge').onclick=()=>{input.value=input.value.split(/\\n{2,}/).map(s=>s.trim()).filter(Boolean).join('\\n\\n---\\n\\n');document.querySelector('#status').textContent='已合并 '+input.value.split('\\n---\\n').length+' 段内容';};document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([input.value],{type:'text/markdown;charset=utf-8'}));a.download='merged.md';a.click();};</script></body></html>
