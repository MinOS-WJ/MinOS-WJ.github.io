<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网络工具集 · MinOS-WJ</title><style>
:root{--bg:#f4f6f8;--panel:#fff;--line:#d9e0e7;--text:#1f2937;--muted:#667085;--brand:#2563eb;--good:#15803d;--warn:#b45309}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;margin-bottom:22px}.top a{color:var(--brand);text-decoration:none}.intro{margin-bottom:20px}.intro h1{margin:0 0 6px;font-size:30px}.intro p{margin:0;color:var(--muted)}.toolbar{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}button{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);padding:9px 13px;cursor:pointer}button.primary{background:var(--brand);border-color:var(--brand);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}.panel h2{font-size:16px;margin:0 0 4px}.panel p{color:var(--muted);font-size:13px;margin:0 0 14px}.targets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.target{border:1px solid var(--line);border-radius:9px;padding:12px}.target strong{display:block}.target small{color:var(--muted)}.target .result{margin-top:8px;font-variant-numeric:tabular-nums}.ok{color:var(--good)}.bad{color:#b91c1c}.note{font-size:12px;color:var(--muted);line-height:1.7}@media(max-width:720px){.targets{grid-template-columns:1fr}}\n+</style></head><body><div class="wrap"><div class="top"><a href="index-network.html">← 返回工作台</a><strong>网络工具集</strong></div><section class="intro"><h1>网络诊断</h1><p>在当前浏览器环境测试常用站点可达性与响应时间。</p></section><section class="panel"><h2>站点延迟 / 丢包</h2><p>每个站点发送 3 次轻量请求；浏览器跨域限制可能影响结果，仅供快速参考。</p><div class="toolbar"><button class="primary" id="run">开始测试</button><button id="clear">清空结果</button><span id="summary" class="note">尚未测试</span></div><div class="targets" id="targets"></div></section><section class="panel"><h2>Ping 与 VPN 检测说明</h2><p class="note">纯网页无法发送 ICMP Ping，也无法可靠判断 VPN/代理。下方检查会使用 HTTPS 请求、浏览器时区与语言做弱提示，不会记录或上传数据。</p><div class="toolbar"><button id="env">检查当前环境</button></div><div id="envResult" class="note"></div></section></div><script>
const sites=[['百度','https://www.baidu.com/favicon.ico'],['Google','https://www.google.com/favicon.ico'],['BBC','https://www.bbc.com/favicon.ico'],['GitHub','https://github.com/favicon.ico'],['Wikipedia','https://www.wikipedia.org/favicon.ico'],['Cloudflare','https://www.cloudflare.com/favicon.ico']];const targets=document.querySelector('#targets');targets.innerHTML=sites.map((s,i)=>'<div class="target"><strong>'+s[0]+'</strong><small>'+s[1].replace('https://','')+'</small><div class="result" id="r'+i+'">未测试</div></div>').join('');async function test(url){const samples=[];for(let i=0;i<3;i++){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),5000),start=performance.now();try{await fetch(url+'?t='+Date.now()+Math.random(),{mode:'no-cors',cache:'no-store',signal:ctrl.signal});samples.push(Math.round(performance.now()-start));}catch{}clearTimeout(timer);}return samples;}document.querySelector('#run').onclick=async()=>{const btn=document.querySelector('#run');btn.disabled=true;let ok=0,total=0;for(let i=0;i<sites.length;i++){document.querySelector('#r'+i).textContent='测试中…';const values=await test(sites[i][1]);total+=3;if(values.length){ok+=values.length;const avg=Math.round(values.reduce((a,b)=>a+b,0)/values.length);document.querySelector('#r'+i).innerHTML='<span class="ok">'+avg+' ms</span> · 丢包 '+(3-values.length)*33+'%';}else document.querySelector('#r'+i).innerHTML='<span class="bad">不可达</span> · 丢包 100%';}document.querySelector('#summary').textContent='完成：'+ok+'/'+total+' 次请求成功';btn.disabled=false;};document.querySelector('#clear').onclick=()=>{sites.forEach((_,i)=>document.querySelector('#r'+i).textContent='未测试');document.querySelector('#summary').textContent='尚未测试';};document.querySelector('#env').onclick=()=>{const tz=Intl.DateTimeFormat().resolvedOptions().timeZone,lang=navigator.language,online=navigator.onLine;document.querySelector('#envResult').textContent='在线状态：'+(online?'在线':'离线')+' · 时区：'+tz+' · 语言：'+lang+'。如需准确 VPN/代理识别，请在系统网络工具中结合出口 IP 与路由信息判断。';};
</script></body></html>
