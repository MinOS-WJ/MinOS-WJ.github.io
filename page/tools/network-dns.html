<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DNS 查询</title><style>:root{--bg:#f5f7fa;--line:#dfe4ea;--text:#1f2937;--muted:#667085;--brand:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between}.top a{color:var(--brand);text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:24px}.row{display:flex;gap:8px}input,select{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px}button{padding:9px 13px;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px}.result{margin-top:14px;background:#f3f4f6;padding:12px;white-space:pre-wrap;line-height:1.7}@media(max-width:620px){.row{display:grid;grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><a href="index-network.html">← 返回网络工具集</a><strong>DNS 查询</strong></div><section class="panel"><div class="row"><input id="host" value="example.com"><select id="type"><option>A</option><option>AAAA</option><option>MX</option><option>TXT</option></select><button id="run">查询</button></div><div class="result" id="result"></div></section></main><script>document.querySelector('#run').onclick=async()=>{const host=document.querySelector('#host').value.trim(),type=document.querySelector('#type').value,out=document.querySelector('#result');if(!host){out.textContent='请输入域名';return;}out.textContent='查询中…';try{const r=await fetch('https://cloudflare-dns.com/dns-query?name='+encodeURIComponent(host)+'&type='+type,{headers:{accept:'application/dns-json'}});const d=await r.json();out.textContent=(d.Answer||[]).map(x=>x.data).join('\\n')||'没有返回记录';}catch{out.textContent='查询失败，请检查网络或域名';}};</script></body></html>
