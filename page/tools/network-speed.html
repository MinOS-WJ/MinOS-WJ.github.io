<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>速度估算</title><style>:root{--bg:#f5f7fa;--line:#dfe4ea;--text:#1f2937;--muted:#667085;--brand:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between}.top a{color:var(--brand);text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:24px}.hint{color:var(--muted);font-size:13px}.result{margin-top:14px;background:#f3f4f6;padding:12px;white-space:pre-wrap}button{padding:9px 13px;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px}</style></head><body><main class="wrap"><div class="top"><a href="index-network.html">← 返回网络工具集</a><strong>速度估算</strong></div><section class="panel"><p class="hint">下载一个公开小文件估算当前浏览器的下行速度；结果受缓存、CDN 和跨域策略影响。</p><button id="run">开始估算</button><div class="result" id="result">尚未测试</div></section></main><script>document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#result'),url='https://speed.cloudflare.com/__down?bytes=5000000';out.textContent='下载测试中…';const start=performance.now();try{const r=await fetch(url+'\\u0026t='+Date.now(),{cache:'no-store'}),b=await r.blob(),seconds=(performance.now()-start)/1000,mbps=(b.size*8/seconds/1000000).toFixed(2);out.textContent='接收 '+(b.size/1024/1024).toFixed(2)+' MiB · 用时 '+seconds.toFixed(2)+' 秒 · 估算 '+mbps+' Mbps';}catch{out.textContent='测试失败，当前网络或浏览器阻止了测速资源';}};</script></body></html>
