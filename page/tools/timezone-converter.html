<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>时区换算</title><style>:root{--bg:#f5f7fa;--line:#dfe4ea;--text:#1f2937;--muted:#667085;--brand:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:800px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between}.top a{color:var(--brand);text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:24px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}button{padding:9px 13px;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;margin-top:12px}.result{margin-top:14px;padding:12px;background:#f3f4f6}@media(max-width:600px){.row{grid-template-columns:1fr}}</style><link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="manifest" href="../../site.webmanifest">
</head><body><main class="wrap"><div class="top"><a href="index-time.html">← 返回时间工具集</a><strong>时区换算</strong></div><section class="panel"><div class="row"><label>日期时间<input id="date" type="datetime-local"></label><label>源时区<select id="from"></select></label><label>目标时区<select id="to"></select></label></div><button id="run">换算</button><div class="result" id="result"></div></section></main><script>const zones=[['北京','Asia/Shanghai'],['东京','Asia/Tokyo'],['新加坡','Asia/Singapore'],['伦敦','Europe/London'],['巴黎','Europe/Paris'],['纽约','America/New_York'],['洛杉矶','America/Los_Angeles'],['悉尼','Australia/Sydney']];const f=document.querySelector('#from'),t=document.querySelector('#to');[f,t].forEach(s=>s.innerHTML=zones.map(z=>'<option value="'+z[1]+'">'+z[0]+' · '+z[1]+'</option>').join(''));f.value='Asia/Shanghai';t.value='America/New_York';const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());document.querySelector('#date').value=d.toISOString().slice(0,16);document.querySelector('#run').onclick=()=>{const dt=new Date(document.querySelector('#date').value);document.querySelector('#result').textContent=new Intl.DateTimeFormat('zh-CN',{timeZone:t.value,dateStyle:'full',timeStyle:'long'}).format(dt)+'（目标时区）';};</script></body></html>
