<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHA 哈希工具</title><style>:root{--bg:#f5f7fa;--line:#dfe4ea;--text:#1f2937;--brand:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:800px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between}.top a{color:var(--brand);text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:24px}textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:14px monospace}textarea{min-height:180px}button{padding:9px 13px;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;margin-top:10px;cursor:pointer}.result{margin-top:12px;background:#f3f4f6;padding:12px;word-break:break-all;font:13px monospace}</style><link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="manifest" href="../../site.webmanifest">
</head><body><main class="wrap"><div class="top"><a href="index-crypto.html">← 返回加解密工具集</a><strong>SHA 哈希</strong></div><section class="panel"><textarea id="input" placeholder="输入文本"></textarea><select id="algo"><option>SHA-256</option><option>SHA-384</option><option>SHA-512</option></select><button id="run">计算摘要</button><div class="result" id="result"></div></section></main><script>document.querySelector('#run').onclick=async()=>{const b=await crypto.subtle.digest(document.querySelector('#algo').value,new TextEncoder().encode(document.querySelector('#input').value));document.querySelector('#result').textContent=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');};</script></body></html>
