<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown 转 TXT</title><style>:root{--bg:#f5f7fa;--line:#dfe4ea;--text:#1f2937;--muted:#667085;--brand:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between}.top a{color:var(--brand);text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:24px}textarea{width:100%;min-height:360px;border:1px solid var(--line);border-radius:8px;padding:12px;font:14px/1.7 monospace;resize:vertical}button{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;padding:9px 13px;margin-top:10px;cursor:pointer}.hint{color:var(--muted);font-size:13px}</style></head><body><main class="wrap"><div class="top"><a href="index-markdown.html">← 返回 Markdown 工具集</a><strong>Markdown 转 TXT</strong></div><section class="panel"><p class="hint">自动去除标题、列表符号、链接标记和代码符号。</p><textarea id="input" placeholder="粘贴 Markdown 内容…"></textarea><br><button id="download">转换并下载 TXT</button></section></main><script>document.querySelector('#download').onclick=()=>{const raw=document.querySelector('#input').value;const txt=raw.replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/^#{1,6}\s*/gm,'').replace(/^\s*[-*+]\s+/gm,'').replace(/[*_~]/g,'');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.download='markdown-export.txt';a.click();};</script></body></html>
