<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国际时钟 · MinOS-WJ</title><style>
:root{--bg:#f4f6f8;--panel:#fff;--line:#d9e0e7;--text:#1f2937;--muted:#667085;--brand:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;margin-bottom:26px}.top a{color:var(--brand);text-decoration:none}.hero{margin-bottom:22px}.hero h1{margin:0 0 6px;font-size:30px}.hero p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.clock{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.clock .city{font-weight:600}.clock .zone{color:var(--muted);font-size:12px;margin-top:3px}.clock .time{font-size:28px;font-variant-numeric:tabular-nums;margin-top:18px}.clock .date{color:var(--muted);font-size:13px}.badge{display:inline-block;margin-top:12px;padding:3px 8px;border-radius:99px;background:#eef4ff;color:var(--brand);font-size:12px}@media(max-width:780px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.wrap{padding:18px}}
</style></head><body><div class="wrap"><div class="top"><a href="index-time.html">← 返回工作台</a><strong>国际时钟</strong></div><section class="hero"><h1>世界主要城市</h1><p>不使用罗盘视图，直接查看本地时间与 UTC 时差。</p></section><div class="grid" id="grid"></div></div><script>
const zones=[['中国 · 北京','Asia/Shanghai','中国'],['日本 · 东京','Asia/Tokyo','日本'],['韩国 · 首尔','Asia/Seoul','韩国'],['新加坡','Asia/Singapore','新加坡'],['印度 · 新德里','Asia/Kolkata','印度'],['阿联酋 · 迪拜','Asia/Dubai','阿联酋'],['英国 · 伦敦','Europe/London','英国'],['法国 · 巴黎','Europe/Paris','法国'],['德国 · 柏林','Europe/Berlin','德国'],['美国 · 纽约','America/New_York','美国'],['美国 · 洛杉矶','America/Los_Angeles','美国'],['加拿大 · 多伦多','America/Toronto','加拿大'],['澳大利亚 · 悉尼','Australia/Sydney','澳大利亚'],['巴西 · 圣保罗','America/Sao_Paulo','巴西'],['南非 · 约翰内斯堡','Africa/Johannesburg','南非']];const grid=document.querySelector('#grid');grid.innerHTML=zones.map((z,i)=>'<article class="clock"><div class="city">'+z[0]+'</div><div class="zone">'+z[1]+'</div><div class="time" id="t'+i+'">--:--:--</div><div class="date" id="d'+i+'">加载中</div><span class="badge">'+z[2]+'</span></article>').join('');function tick(){const now=new Date();zones.forEach((z,i)=>{document.querySelector('#t'+i).textContent=new Intl.DateTimeFormat('zh-CN',{timeZone:z[1],hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);document.querySelector('#d'+i).textContent=new Intl.DateTimeFormat('zh-CN',{timeZone:z[1],weekday:'short',year:'numeric',month:'long',day:'numeric'}).format(now);});}tick();setInterval(tick,1000);
</script></body></html>
