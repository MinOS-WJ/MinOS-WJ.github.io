<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTTP Ping</title><style>:root{--bg:#f5f7fa;--line:#dfe4ea;--text:#1f2937;--muted:#667085;--brand:#2563eb;--good:#15803d;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between}.top a{color:var(--brand);text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:24px}.row{display:flex;gap:8px}input,select{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px}button{padding:9px 13px;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;cursor:pointer}.result{margin-top:14px;background:#f3f4f6;padding:12px;white-space:pre-wrap;line-height:1.8}.good{color:var(--good)}.bad{color:var(--bad)}@media(max-width:620px){.row{display:grid;grid-template-columns:1fr}}</style><link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="manifest" href="../../site.webmanifest">
</head><body><main class="wrap"><div class="top"><a href="index-network.html">← 返回网络工具集</a><strong>HTTP Ping</strong></div><section class="panel"><div class="row"><input id="url" value="https://www.cloudflare.com/favicon.ico"><select id="count"><option value="3">3 次</option><option value="5">5 次</option><option value="10">10 次</option></select><button id="run">开始测试</button></div><div class="result" id="result">支持 CORS 或 no-cors 的 HTTPS 地址。网页 Ping 测量的是 HTTP 请求，不是 ICMP。</div></section></main><script>document.querySelector('#run').onclick=async()=>{const url=document.querySelector('#url').value.trim(),count=Number(document.querySelector('#count').value),out=document.querySelector('#result');if(!/^https?:\/\//.test(url)){out.textContent='请输入完整 URL';return;}const values=[];out.textContent='测试中…';for(let i=0;i<count;i++){const c=new AbortController(),timer=setTimeout(()=>c.abort(),5000),start=performance.now();try{await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now()+i,{mode:'no-cors',cache:'no-store',signal:c.signal});values.push(Math.round(performance.now()-start));}catch{}clearTimeout(timer);}if(!values.length){out.innerHTML='<span class="bad">全部请求失败，丢包 100%</span>';return;}const avg=Math.round(values.reduce((a,b)=>a+b,0)/values.length),min=Math.min(...values),max=Math.max(...values);out.innerHTML='<span class="good">成功 '+values.length+'/'+count+'</span> · 丢包 '+Math.round((count-values.length)/count*100)+'%\n平均 '+avg+' ms · 最快 '+min+' ms · 最慢 '+max+' ms';};</script></body></html>
