<style>:root{--bg:#f5f7fa;--panel:#fff;--line:#dfe4ea;--text:#1f2937;--muted:#667085;--brand:#2563eb;--soft:#eef4ff;--good:#15803d;--warn:#b45309;--shadow:0 8px 24px rgba(31,41,55,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:24px 24px 50px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}.top a{color:var(--brand);text-decoration:none}.intro{display:flex;justify-content:space-between;gap:25px;padding:42px 0 28px}.eyebrow{color:var(--brand);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.intro h1{margin:8px 0 10px;font-size:clamp(32px,5vw,52px);line-height:1.05;letter-spacing:-.055em}.intro p{max-width:660px;margin:0;color:var(--muted)}.intro-side{text-align:right;min-width:210px;color:var(--muted)}.intro-side strong{display:block;color:var(--text);font-size:17px;margin-bottom:4px}.status{display:inline-flex;align-items:center;gap:6px;font-size:12px}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.status.ok{color:var(--good)}.status.error{color:#b91c1c}.notice{display:none;margin-bottom:16px;padding:12px 14px;border:1px solid #f0c9ce;border-radius:9px;background:#fff4f5;color:#a33a47}.notice.show{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px}.stat{padding:17px;border:1px solid var(--line);border-radius:11px;background:var(--panel);box-shadow:var(--shadow)}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{display:block;margin-top:5px;font-size:25px;letter-spacing:-.04em}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:28px 0 12px}.section-head h2{margin:0;font-size:19px}.section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.domains{display:flex;gap:7px;overflow:auto;padding:2px 0 4px}.domain{flex:none;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted)}.domain:hover{border-color:#9db8e8;color:var(--brand)}.domain.active{border-color:var(--brand);background:var(--brand);color:#fff}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.podium-card{position:relative;min-height:142px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);cursor:pointer}.podium-card.featured{border-color:#9db8e8;background:linear-gradient(135deg,#fff,#f0f5ff)}.podium-rank{color:var(--brand);font-size:23px;font-weight:850}.podium-provider{margin-top:15px;color:var(--muted);font-size:12px}.podium-name{font-weight:750;line-height:1.3}.podium-score{position:absolute;right:17px;top:17px;font-size:23px;font-weight:800;color:var(--brand)}.podium-score small{display:block;color:var(--muted);font-size:10px;font-weight:500;text-align:right}.toolbar{display:grid;grid-template-columns:minmax(220px,1.5fr) 170px 170px 170px auto;gap:8px;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--panel);box-shadow:var(--shadow)}.field{min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);outline:none}.field:focus{border-color:#8eb0e8;box-shadow:0 0 0 3px var(--soft)}.toolbar button{padding:9px 14px;border:1px solid var(--brand);border-radius:8px;background:var(--brand);color:#fff}.table-panel{margin-top:14px;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow)}.table-scroll{overflow:auto}table{width:100%;min-width:930px;border-collapse:collapse}th,td{padding:13px 14px;text-align:left;border-bottom:1px solid #edf0f4;vertical-align:middle}th{background:#fbfcfe;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.06em}tbody tr{cursor:pointer}tbody tr:hover{background:#f8faff}.rank{color:var(--brand);font-weight:800}.model{min-width:280px}.model strong{display:block;max-width:390px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.model small{display:block;margin-top:2px;color:var(--muted)}.score{font-weight:800}.meter{width:80px;height:5px;margin-top:6px;border-radius:9px;background:#e8edf5;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa)}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{display:inline-flex;padding:3px 8px;border-radius:999px;background:#f0f2f6;color:#5d687c;font-size:11px;white-space:nowrap}.chip.good{background:#eaf8ef;color:var(--good)}.price{color:var(--good);white-space:nowrap}.muted{color:var(--muted)}.table-foot{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;color:var(--muted);font-size:12px}.pager{display:flex;gap:6px}.pager button{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--text)}.pager button:disabled{opacity:.45;cursor:not-allowed}.empty{padding:55px 20px;text-align:center;color:var(--muted)}.drawer{position:fixed;inset:0;display:none;justify-content:flex-end;background:rgba(31,41,55,.32);z-index:4}.drawer.open{display:flex}.drawer-panel{width:min(550px,100%);height:100%;overflow:auto;padding:24px;background:#fff;box-shadow:-12px 0 30px rgba(31,41,55,.12)}.drawer-head{display:flex;justify-content:space-between;gap:14px}.drawer-head h2{margin:0;font-size:25px;line-height:1.15}.drawer-head p{margin:6px 0 0;color:var(--muted)}.close{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:#f8fafc;font-size:20px;color:var(--text)}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:22px 0}.detail{padding:11px;border:1px solid var(--line);border-radius:9px;background:#fbfcfe}.detail span{display:block;color:var(--muted);font-size:11px}.detail b{display:block;margin-top:3px;overflow-wrap:anywhere;font-size:15px}.drawer-section{padding-top:16px;margin-top:16px;border-top:1px solid var(--line)}.drawer-section h3{margin:0 0 9px;font-size:13px}.raw{max-height:280px;overflow:auto;margin:0;padding:12px;border-radius:9px;background:#f5f7fa;color:#475467;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}.drawer-actions{display:flex;gap:8px;margin-top:20px}.drawer-actions button,.drawer-actions a{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);text-decoration:none}.drawer-actions .primary{border-color:var(--brand);background:var(--brand);color:#fff}@media(max-width:950px){.intro{display:block}.intro-side{margin-top:18px;text-align:left}.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}.toolbar button{min-height:39px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.wrap{padding:18px 14px 40px}.top strong{display:none}.intro{padding-top:36px}.podium{grid-template-columns:1fr}.podium-card.featured{order:-1}.section-head{display:block}.section-head p{margin-top:4px}.toolbar{grid-template-columns:1fr}.toolbar .search{grid-column:auto}.table-foot{display:block}.pager{margin-top:9px}.drawer-panel{padding:19px}}
</style></head>
<body><main class="wrap"><header class="top"><a href="../../index.html">← 返回工作台</a><strong>模型排行榜</strong></header>
<section class="intro"><div><div class="eyebrow">Model intelligence index</div><h1>模型排行榜<br><span style="color:var(--brand)">从数据里看能力</span></h1><p>直接读取仓库 `data` 目录中的 11 个领域快照，按榜单、厂商、开放权重、能力、上下文和成本比较模型。</p></div><div class="intro-side"><strong id="updated">正在加载数据</strong><span id="status" class="status">准备读取 latest.json</span></div></section>
<div id="notice" class="notice"></div><section class="stats"><div class="stat"><span>当前记录</span><b id="statRows">—</b></div><div class="stat"><span>去重模型</span><b id="statModels">—</b></div><div class="stat"><span>厂商数量</span><b id="statProviders">—</b></div><div class="stat"><span>当前平均得分</span><b id="statAverage">—</b></div></section>
<section><div class="section-head"><div><h2>领域</h2><p>切换不同能力方向的榜单</p></div></div><nav id="domains" class="domains" aria-label="排行榜领域"></nav></section>
<section><div class="section-head"><div><h2>本期前三</h2><p id="podiumCaption">当前领域综合得分最高的模型</p></div></div><div id="podium" class="podium"></div></section>
<section><div class="section-head"><div><h2 id="tableTitle">全部模型</h2><p id="tableMeta">—</p></div></div><div class="toolbar"><input id="search" class="field search" placeholder="搜索模型、厂商、家族或能力…"><select id="provider" class="field"><option value="all">全部厂商</option></select><select id="weight" class="field"><option value="all">开放权重：不限</option><option value="open">仅开放权重</option><option value="closed">仅闭源模型</option><option value="unknown">状态未知</option></select><select id="sort" class="field"><option value="rank">按榜单排名</option><option value="score">按综合得分</option><option value="cost">按价格从低到高</option><option value="release">按发布日期</option><option value="context">按上下文窗口</option></select><button id="reload">重新读取</button></div><div class="table-panel"><div class="table-scroll"><table><thead><tr><th>排名</th><th>模型 / 厂商</th><th>综合得分</th><th>能力</th><th>综合价格</th><th>上下文</th><th>权重</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>没有符合条件的模型，请调整筛选条件。</div></div><div class="table-foot"><span id="resultCount">—</span><div class="pager"><button id="prev">上一页</button><button id="next">下一页</button></div></div></div></section></main>
<aside id="drawer" class="drawer" aria-hidden="true"><div class="drawer-panel"><div class="drawer-head"><div><h2 id="detailName">模型详情</h2><p id="detailSubtitle"></p></div><button id="close" class="close" aria-label="关闭">×</button></div><div id="detailGrid" class="detail-grid"></div><section class="drawer-section"><h3>能力分布</h3><div id="detailCaps" class="chips"></div></section><section class="drawer-section"><h3>所属领域与模态</h3><div id="detailTags" class="chips"></div></section><section class="drawer-section"><h3>原始记录</h3><pre id="detailRaw" class="raw"></pre></section><div class="drawer-actions"><button id="copy" class="primary">复制模型 ID</button><a id="source" href="#" target="_blank" rel="noreferrer">查看来源</a></div></div></aside>
<script>
const DATA_PATH='../../data/latest.json',LABELS={all:'全部领域',general:'综合',coding:'编程',math:'数学',science:'科学',reasoning:'推理',agents:'Agents',multimodal:'多模态','image-gen':'图像生成','video-gen':'文生视频','image-to-video':'图生视频',audio:'音频'},$=id=>document.getElementById(id),state={records:[],domains:{},active:'all',page:1,pageSize:50,detailId:''};
const safe=value=>value===null||value===undefined||value===''||String(value).startsWith('$')?null:value,num=value=>{const n=Number(safe(value));return Number.isFinite(n)?n:null},esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=(value,digits=1)=>num(value)===null?'—':num(value).toLocaleString('zh-CN',{maximumFractionDigits:digits}),date=value=>{const v=safe(value);if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleDateString('zh-CN')},context=value=>{const n=num(value);return n===null?'—':n>=1000000?fmt(n/1000000,1)+'M':n>=1000?fmt(n/1000,0)+'K':fmt(n,0)},price=value=>num(value)===null?'—':'$'+fmt(value,4);
function normalize(row,domain){const model=row.model||{},pricing=model.pricing||{},capabilities=model.capabilities||{};return{id:String(row.id||model.id||row.modelId||row.name||''),name:String(model.name||row.name||'未命名模型'),provider:String(model.provider||row.provider||'未知厂商'),family:String(model.family||''),domain,rank:num(row.rank),score:num(row.score),source:String(row.source||''),openWeight:model.openWeight===true?true:model.openWeight===false?false:null,releaseDate:model.releaseDate||'',pricing,capabilities,domains:Array.isArray(model.domains)?model.domains:[],modalities:Array.isArray(model.modalities)?model.modalities:[],contextWindow:num(model.contextWindow),raw:row,model};}
function parse(payload){if(!payload||typeof payload!=='object')throw Error('数据格式无效');const source=payload.domains&&typeof payload.domains==='object'?payload.domains:{};const records=[];for(const [domain,item] of Object.entries(source))for(const row of Array.isArray(item?.rankings)?item.rankings:[])records.push(normalize(row,domain));if(!records.length)throw Error('没有找到 rankings 数据');state.domains=source;state.records=records;state.page=1;return payload;}
function status(message,type=''){const el=$('status');el.textContent=message;el.className='status '+type;}function rows(){const query=$('search').value.trim().toLowerCase(),provider=$('provider').value,weight=$('weight').value,sort=$('sort').value;const result=state.records.filter(row=>{if(state.active!=='all'&&row.domain!==state.active)return false;const hay=[row.name,row.provider,row.family,row.id,row.domain,...row.domains,...row.modalities,Object.keys(row.capabilities)].join(' ').toLowerCase();if(query&&!hay.includes(query))return false;if(provider!=='all'&&row.provider!==provider)return false;if(weight==='open'&&row.openWeight!==true)return false;if(weight==='closed'&&row.openWeight!==false)return false;if(weight==='unknown'&&row.openWeight!==null)return false;return true});result.sort((a,b)=>sort==='score'?(b.score??-Infinity)-(a.score??-Infinity):sort==='cost'?(num(a.pricing.blended)??Infinity)-(num(b.pricing.blended)??Infinity):sort==='release'?String(b.releaseDate).localeCompare(String(a.releaseDate)):sort==='context'?(b.contextWindow??-Infinity)-(a.contextWindow??-Infinity):(a.rank??Infinity)-(b.rank??Infinity));return result;}
function domains(){const keys=['all',...Object.keys(state.domains)];$('domains').innerHTML=keys.map(key=>`<button class="domain ${key===state.active?'active':''}" data-domain="${esc(key)}">${esc(LABELS[key]||key)}</button>`).join('');}function providers(){const selected=$('provider').value,values=[...new Set(state.records.filter(row=>state.active==='all'||row.domain===state.active).map(row=>row.provider))].sort((a,b)=>a.localeCompare(b));$('provider').innerHTML='<option value="all">全部厂商</option>'+values.map(value=>`<option value="${esc(value)}">${esc(value)}</option>`).join('');if(values.includes(selected))$('provider').value=selected;}
function caps(row){const values=Object.entries(row.capabilities||{}).filter(([,value])=>num(value)!==null&&num(value)>0).sort((a,b)=>num(b[1])-num(a[1])).slice(0,4);return values.length?values.map(([key,value])=>`<span class="chip">${esc(key)} ${fmt(value,0)}</span>`).join(''):'<span class="chip">暂无能力分项</span>';}
function podium(){const top=rows().slice(0,3);$('podiumCaption').textContent=state.active==='all'?'全部领域综合得分最高的模型':`${LABELS[state.active]||state.active} 领域综合得分最高的模型`;$('podium').innerHTML=top.length?top.map((row,index)=>`<article class="podium-card ${index===0?'featured':''}" data-id="${esc(row.id+'@'+row.domain+'@'+row.rank)}"><div class="podium-rank">#${index+1}</div><div class="podium-score">${fmt(row.score,1)}<small>综合得分</small></div><div class="podium-provider">${esc(row.provider)}</div><div class="podium-name">${esc(row.name)}</div></article>`).join(''):'<div class="empty">暂无榜单数据</div>';}
function table(){const all=rows(),pages=Math.max(1,Math.ceil(all.length/state.pageSize));state.page=Math.min(state.page,pages);const visible=all.slice((state.page-1)*state.pageSize,state.page*state.pageSize);$('tableTitle').textContent=LABELS[state.active]||state.active;$('tableMeta').textContent=`${all.length.toLocaleString()} 条记录 · 第 ${state.page}/${pages} 页`;$('resultCount').textContent=`显示 ${visible.length} / ${all.length.toLocaleString()} 条`;$('prev').disabled=state.page<=1;$('next').disabled=state.page>=pages;$('empty').hidden=visible.length>0;$('rows').innerHTML=visible.map(row=>{const weight=row.openWeight===true?'开放权重':row.openWeight===false?'闭源':'未知';return`<tr data-id="${esc(row.id+'@'+row.domain+'@'+row.rank)}"><td class="rank">#${esc(row.rank??'—')}</td><td class="model"><strong title="${esc(row.name)}">${esc(row.name)}</strong><small>${esc(row.provider)}${row.family?' · '+esc(row.family):''}</small></td><td><span class="score">${fmt(row.score,1)}</span><div class="meter"><i style="width:${Math.max(0,Math.min(100,row.score??0))}%"></i></div></td><td><div class="chips">${caps(row)}</div></td><td class="price">${price(row.pricing.blended)}</td><td class="muted">${context(row.contextWindow)}</td><td><span class="chip ${row.openWeight===true?'good':''}">${weight}</span></td></tr>`}).join('');const scores=all.map(row=>row.score).filter(value=>value!==null);$('statRows').textContent=all.length.toLocaleString();$('statModels').textContent=new Set(all.map(row=>row.id)).size.toLocaleString();$('statProviders').textContent=new Set(all.map(row=>row.provider)).size.toLocaleString();$('statAverage').textContent=scores.length?fmt(scores.reduce((a,b)=>a+b,0)/scores.length,1):'—';}
function render(){domains();providers();podium();table();}function find(id){return state.records.find(row=>row.id+'@'+row.domain+'@'+row.rank===id);}function openDetail(row){if(!row)return;state.detailId=row.id;$('detailName').textContent=row.name;$('detailSubtitle').textContent=[row.provider,row.family,LABELS[row.domain]||row.domain].filter(Boolean).join(' · ');const weight=row.openWeight===true?'开放权重':row.openWeight===false?'闭源':'未知';$('detailGrid').innerHTML=[['综合得分',fmt(row.score,1)],['榜单排名',row.rank?'#'+row.rank:'—'],['发布日期',date(row.releaseDate)],['上下文窗口',context(row.contextWindow)],['综合价格',price(row.pricing.blended)],['输入 / 输出',`${price(row.pricing.input)} / ${price(row.pricing.output)}`],['模型 ID',row.id],['权重状态',weight]].map(([key,value])=>`<div class="detail"><span>${esc(key)}</span><b>${esc(value)}</b></div>`).join('');$('detailCaps').innerHTML=caps(row);$('detailTags').innerHTML=[...row.domains,...row.modalities].filter(Boolean).map(value=>`<span class="chip">${esc(value)}</span>`).join('')||'<span class="chip">暂无标签</span>';$('detailRaw').textContent=JSON.stringify(row.raw,null,2);$('source').href=row.model?.llmStatsUrl||row.source||'#';$('drawer').classList.add('open');$('drawer').setAttribute('aria-hidden','false');}
async function load(){status('正在读取 latest.json');$('reload').disabled=true;try{const response=await fetch(DATA_PATH+'?v='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const payload=parse(await response.json());$('updated').textContent=`更新于 ${date(payload.fetched_at)} · ${state.records.length.toLocaleString()} 条`;status('数据读取成功','ok');$('notice').classList.remove('show');render();}catch(error){status('数据读取失败','error');$('updated').textContent='无法读取数据';$('notice').textContent=location.protocol==='file:'?'请从 GitHub Pages 发布地址访问此页面，不要直接双击 HTML 文件。':`无法读取 ../../data/latest.json：${error.message}`;$('notice').classList.add('show');}finally{$('reload').disabled=false;}}
$('domains').onclick=event=>{const button=event.target.closest('[data-domain]');if(button){state.active=button.dataset.domain;state.page=1;render();}};$('search').oninput=()=>{state.page=1;podium();table();};$('provider').onchange=()=>{state.page=1;podium();table();};$('weight').onchange=()=>{state.page=1;podium();table();};$('sort').onchange=()=>{state.page=1;podium();table();};$('reload').onclick=load;$('prev').onclick=()=>{state.page--;table();};$('next').onclick=()=>{state.page++;table();};$('rows').onclick=event=>{const row=event.target.closest('[data-id]');if(row)openDetail(find(row.dataset.id));};$('podium').onclick=event=>{const card=event.target.closest('[data-id]');if(card)openDetail(find(card.dataset.id));};$('close').onclick=()=>{$('drawer').classList.remove('open');$('drawer').setAttribute('aria-hidden','true');};$('drawer').onclick=event=>{if(event.target===$('drawer'))$('close').click();};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(state.detailId);$('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制模型 ID',1400);}catch{}};load();
</script></body></html>
