<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Token 与费用估算 · MinOS-WJ</title><style>:root{--bg:#f5f7fa;--line:#dfe4ea;--text:#1f2937;--muted:#667085;--brand:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}.top a{color:var(--brand);text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:24px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.field input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px}textarea{width:100%;min-height:260px;margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:12px;font:14px/1.7 monospace}button{margin-top:12px;padding:9px 13px;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;cursor:pointer}.result{margin-top:14px;padding:14px;background:#f3f4f6;line-height:1.9}.hint{color:var(--muted);font-size:13px}@media(max-width:580px){.row{grid-template-columns:1fr}}</style><link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="manifest" href="../../site.webmanifest">
</head><body><main class="wrap"><header class="top"><a href="index.html">← 返回 AI 工具集</a><strong>Token 与费用估算</strong></header><section class="panel"><p class="hint">这是跨模型的粗略估算，不等同于供应商 tokenizer；中文通常按字符附近估算，英文按约 4 个字符一个 token。</p><div class="row"><div class="field"><label>输入价格（$/1M tokens）</label><input id="inPrice" type="number" step="0.01" value="1"></div><div class="field"><label>输出价格（$/1M tokens）</label><input id="outPrice" type="number" step="0.01" value="3"></div></div><textarea id="input" placeholder="粘贴 Prompt 或对话内容…"></textarea><button id="run">估算</button><div class="result" id="result">等待输入</div></section></main><script>function estimate(s){let cjk=0,latin=0,spaces=0;for(const ch of s){const n=ch.codePointAt(0);if(n>=0x3400&&n<=0x9fff)cjk++;else{latin++;if(ch.charCodeAt(0)===32||ch.charCodeAt(0)===9)spaces++;}}return Math.ceil(cjk+latin/4+spaces*.25);}document.querySelector('#run').onclick=()=>{const text=document.querySelector('#input').value,inputTokens=estimate(text),outputTokens=Math.ceil(inputTokens*.25),ip=Number(document.querySelector('#inPrice').value||0),op=Number(document.querySelector('#outPrice').value||0),cost=(inputTokens*ip+outputTokens*op)/1000000;document.querySelector('#result').textContent='字符数：'+text.length+'\\n输入估算：'+inputTokens+' tokens\\n输出预留：'+outputTokens+' tokens\\n本次估算费用：$'+cost.toFixed(6);};</script></body></html>
