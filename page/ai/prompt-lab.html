<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>提示词工作台 · MinOS-WJ</title><style>:root{--bg:#f5f7fa;--panel:#fff;--line:#dfe4ea;--text:#1f2937;--muted:#667085;--brand:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}.top a{color:var(--brand);text-decoration:none}.layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}.panel h2{font-size:16px;margin:0 0 10px}textarea{width:100%;min-height:340px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:12px;font:14px/1.7 monospace}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 12px;cursor:pointer}button.primary{background:var(--brand);border-color:var(--brand);color:#fff}.hint{color:var(--muted);font-size:13px;line-height:1.6}.templates{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.template{padding:6px 9px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:12px;cursor:pointer}.output{background:#f3f4f6;border-radius:8px;padding:12px;min-height:340px;white-space:pre-wrap;overflow:auto}@media(max-width:760px){.layout{grid-template-columns:1fr}}\n+</style></head><body><main class="wrap"><header class="top"><a href="index.html">← 返回 AI 工具集</a><strong>提示词工作台</strong></header><div class="layout"><section class="panel"><h2>模板与变量</h2><div class="templates"><button class="template" data-template="summarize">摘要</button><button class="template" data-template="coding">代码审查</button><button class="template" data-template="translate">翻译</button></div><p class="hint">使用 {{变量名}} 插入变量；变量 JSON 例如：{"language":"中文","text":"待处理内容"}。</p><textarea id="prompt">请用 {{language}} 总结下面内容，输出 3 个要点：\n\n{{text}}</textarea><textarea id="vars" placeholder='变量 JSON，例如 {"language":"中文","text":"内容"}'>{\"language\":\"中文\",\"text\":\"MinOS-WJ 是一个浏览器工作台。\"}</textarea><div class="toolbar"><button class="primary" id="render">生成预览</button><button id="copy">复制结果</button><button id="save">保存到本地</button></div></section><section class="panel"><h2>最终提示词</h2><div class="output" id="output"></div><p class="hint" id="status">预览结果不会发送到任何服务器。</p></section></div></main><script>const templates={summarize:'请用 {{language}} 总结下面内容，输出 3 个要点：\\n\\n{{text}}',coding:'请审查下面的 {{language}} 代码，按“问题、风险、改进建议、修改示例”输出：\\n\\n{{text}}',translate:'请把下面内容翻译成 {{language}}，保留专业术语并只输出译文：\\n\\n{{text}}'};const $=id=>document.querySelector('#'+id);function render(){let vars={};try{vars=JSON.parse($('vars').value||'{}');}catch{$('status').textContent='变量 JSON 格式错误';return;}let text=$('prompt').value.replace(/{{\\s*([\\w.-]+)\\s*}}/g,(_,k)=>vars[k]??'['+k+' 未提供]');$('output').textContent=text;$('status').textContent='已生成本地预览';}document.querySelectorAll('.template').forEach(b=>b.onclick=()=>{$('prompt').value=templates[b.dataset.template];render();});$('render').onclick=render;$('copy').onclick=async()=>{await navigator.clipboard.writeText($('output').textContent);$('status').textContent='已复制';};$('save').onclick=()=>{localStorage.setItem('minos-prompt',JSON.stringify({prompt:$('prompt').value,vars:$('vars').value}));$('status').textContent='已保存到本地';};const saved=JSON.parse(localStorage.getItem('minos-prompt')||'null');if(saved){$('prompt').value=saved.prompt;$('vars').value=saved.vars;}render();</script></body></html>
