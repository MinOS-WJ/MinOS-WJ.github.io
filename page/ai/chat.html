<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 对话 · MinOS-WJ</title><style>:root{--bg:#f5f7fa;--line:#dfe4ea;--text:#1f2937;--muted:#667085;--brand:#2563eb;--soft:#eef4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}.top a{color:var(--brand);text-decoration:none}.layout{display:grid;grid-template-columns:300px 1fr;gap:14px;margin-top:24px}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}.panel h2{font-size:16px;margin:0 0 12px}.field{margin-bottom:11px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}input,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font:14px system-ui}textarea{resize:vertical;min-height:90px}.chat{min-height:520px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:4px}.msg{max-width:85%;padding:10px 12px;border-radius:9px;background:#f3f4f6;margin:0 0 10px;white-space:pre-wrap}.msg.user{margin-left:auto;background:var(--soft)}.composer{display:flex;gap:8px;margin-top:12px}.composer textarea{min-height:48px;max-height:160px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 12px;cursor:pointer}button.primary{background:var(--brand);border-color:var(--brand);color:#fff}.status{color:var(--muted);font-size:12px;margin-top:9px;min-height:18px}@media(max-width:800px){.layout{grid-template-columns:1fr}.chat{min-height:460px}}</style><link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="manifest" href="../../site.webmanifest">
</head><body><main class="wrap"><header class="top"><a href="index.html">← 返回 AI 工具集</a><strong>AI 对话与 API 测试</strong></header><div class="layout"><aside class="panel"><h2>连接设置</h2><div class="field"><label>Base URL</label><input id="base" value="https://api.openai.com/v1"></div><div class="field"><label>模型</label><input id="model" value="gpt-4o-mini"></div><div class="field"><label>API Key（仅保存在当前页面）</label><input id="key" type="password" placeholder="sk-…"></div><div class="field"><label>系统提示词</label><textarea id="system">你是一个简洁、准确的中文助手。</textarea></div><div class="actions"><button class="primary" id="test">测试连接</button><button id="clear">清空对话</button></div><div class="status" id="status">未连接</div></aside><section class="panel chat"><h2>对话</h2><div class="messages" id="messages"></div><div class="composer"><textarea id="input" placeholder="输入消息，Ctrl/Cmd + Enter 发送"></textarea><button class="primary" id="send">发送</button></div></section></div></main><script>const state={messages:[]},$=id=>document.querySelector('#'+id),messages=$('messages');function add(role,text){const el=document.createElement('div');el.className='msg '+role;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;}function settings(){return{base:$('base').value.replace(/\/$/,'') ,model:$('model').value,key:$('key').value,system:$('system').value};}async function call(extra){const s=settings();if(!s.key)throw new Error('请先填写 API Key');const body={model:s.model,messages:[{role:'system',content:s.system},...state.messages,...(extra||[])],temperature:.7};const r=await fetch(s.base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.key},body:JSON.stringify(body)});if(!r.ok)throw new Error('HTTP '+r.status+'：'+(await r.text()).slice(0,180));return r.json();}$('send').onclick=async()=>{const text=$('input').value.trim();if(!text)return;$('input').value='';add('user',text);state.messages.push({role:'user',content:text});$('status').textContent='生成中…';try{const d=await call();const answer=d.choices?.[0]?.message?.content||'接口未返回内容';state.messages.push({role:'assistant',content:answer});add('assistant',answer);$('status').textContent='完成';}catch(e){add('assistant','请求失败：'+e.message);$('status').textContent='请求失败';}};$('test').onclick=async()=>{$('status').textContent='测试中…';try{const d=await call([{role:'user',content:'请只回复：连接成功'}]);$('status').textContent='连接成功：'+(d.choices?.[0]?.message?.content||'接口已响应');}catch(e){$('status').textContent='连接失败：'+e.message;}};$('clear').onclick=()=>{state.messages.length=0;messages.innerHTML='';$('status').textContent='已清空';};$('input').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')$('send').click();});</script></body></html>
