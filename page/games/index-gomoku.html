<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>五子棋 · MinOS-WJ</title>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--line:#dfe4ea;--text:#1f2937;--muted:#667085;--brand:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:760px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between}.top a{color:var(--brand);text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:20px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.status{color:var(--brand);font-weight:600}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls label{color:var(--muted);font-size:13px}.controls select,button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}canvas{display:block;width:min(100%,620px);aspect-ratio:1;margin:16px auto;background:#d7a35d;border-radius:8px;touch-action:manipulation}.hint{color:var(--muted);font-size:13px;text-align:center;margin-bottom:0}
</style>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="manifest" href="../../site.webmanifest">
</head>
<body>
<main class="wrap"><div class="top"><a href="../../index.html">← 返回小游戏</a><strong>五子棋</strong></div>
<section class="panel"><div class="bar"><div class="controls"><label>模式 <select id="mode"><option value="ai">人机对战</option><option value="local">本地双人</option></select></label><label id="sideLabel">玩家 <select id="side"><option value="1">执黑（先手）</option><option value="2">执白</option></select></label></div><div><span class="status" id="status">黑方回合</span> <button class="primary" id="reset">重新开始</button></div></div><canvas id="board" width="620" height="620"></canvas><p class="hint">点击或触摸棋盘落子；人机模式支持选择先手，AI 会优先获胜或拦截连线。</p></section></main>
<script>
const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d'),size=15,pad=28,cell=(canvas.width-pad*2)/(size-1),statusEl=document.querySelector('#status'),modeEl=document.querySelector('#mode'),sideEl=document.querySelector('#side'),sideLabel=document.querySelector('#sideLabel');let board,turn,over,thinking,lastMove,aiTimer;
function reset(){clearTimeout(aiTimer);board=Array.from({length:size},()=>Array(size).fill(0));turn=1;over=false;thinking=false;lastMove=null;sideLabel.style.display=modeEl.value==='ai'?'inline-flex':'none';setStatus();draw();if(modeEl.value==='ai'&&Number(sideEl.value)===2)scheduleAi();}
function setStatus(message){statusEl.textContent=message|| (over?'':thinking?'AI 思考中…':(turn===1?'黑方':'白方')+'回合');}
function draw(){ctx.fillStyle='#d7a35d';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='rgba(65,38,12,.7)';ctx.lineWidth=1;for(let i=0;i<size;i++){const p=pad+i*cell;ctx.beginPath();ctx.moveTo(pad,p);ctx.lineTo(canvas.width-pad,p);ctx.stroke();ctx.beginPath();ctx.moveTo(p,pad);ctx.lineTo(p,canvas.height-pad);ctx.stroke();}for(const [x,y] of [[3,3],[11,3],[7,7],[3,11],[11,11]]){ctx.fillStyle='rgba(65,38,12,.7)';ctx.beginPath();ctx.arc(pad+x*cell,pad+y*cell,3,0,Math.PI*2);ctx.fill();}board.forEach((row,y)=>row.forEach((v,x)=>{if(!v)return;ctx.beginPath();ctx.arc(pad+x*cell,pad+y*cell,cell*.38,0,Math.PI*2);ctx.fillStyle=v===1?'#111827':'#f8fafc';ctx.fill();ctx.strokeStyle=v===1?'#030712':'#64748b';ctx.stroke();if(lastMove&&lastMove.x===x&&lastMove.y===y){ctx.fillStyle=v===1?'#f8fafc':'#111827';ctx.beginPath();ctx.arc(pad+x*cell,pad+y*cell,3,0,Math.PI*2);ctx.fill();}}));}
function inBoard(x,y){return x>=0&&x<size&&y>=0&&y<size}function lineCount(x,y,dx,dy,v){let count=1,open=0;for(const dir of [1,-1]){let a=x+dx*dir,b=y+dy*dir;while(inBoard(a,b)&&board[b][a]===v){count++;a+=dx*dir;b+=dy*dir;}if(inBoard(a,b)&&board[b][a]===0)open++;}return {count,open};}function win(x,y){const v=board[y][x];return [[1,0],[0,1],[1,1],[1,-1]].some(([dx,dy])=>lineCount(x,y,dx,dy,v).count>=5);}
function finish(v){over=true;thinking=false;clearTimeout(aiTimer);setStatus(v===0?'和棋':(v===1?'黑方':'白方')+'获胜');draw();}
function place(x,y,v){if(over||board[y][x])return false;board[y][x]=v;lastMove={x,y};draw();if(win(x,y)){finish(v);return true;}if(board.every(row=>row.every(Boolean))){finish(0);return true;}turn=v===1?2:1;setStatus();return true;}
function candidateCells(){const set=new Set();for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(board[y][x])for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const a=x+dx,b=y+dy;if(inBoard(a,b)&&!board[b][a])set.add(a+','+b);}if(!set.size)set.add('7,7');return [...set].map(s=>s.split(',').map(Number));}
function scoreCell(x,y,v){let score=0;for(const [dx,dy] of [[1,0],[0,1],[1,1],[1,-1]]){const info=lineCount(x,y,dx,dy,v);score+=info.count>=5?100000:info.count===4?(info.open===2?12000:2500):info.count===3?(info.open===2?900:180):info.count===2?(info.open===2?80:20):4;}const center=7-Math.abs(x-7)+7-Math.abs(y-7);return score+center*3;}
function chooseAi(){const ai=Number(sideEl.value)===1?2:1,human=ai===1?2:1,cells=candidateCells();for(const [x,y] of cells){board[y][x]=ai;const won=win(x,y);board[y][x]=0;if(won)return [x,y];}for(const [x,y] of cells){board[y][x]=human;const won=win(x,y);board[y][x]=0;if(won)return [x,y];}let best=cells[0],bestScore=-Infinity;for(const [x,y] of cells){const attack=scoreCell(x,y,ai),defense=scoreCell(x,y,human);const score=attack*1.08+defense;if(score>bestScore){bestScore=score;best=[x,y];}}return best;}
function scheduleAi(){if(over||modeEl.value!=='ai'||turn===Number(sideEl.value))return;thinking=true;setStatus();aiTimer=setTimeout(()=>{if(!over&&thinking){const move=chooseAi();thinking=false;place(move[0],move[1],turn);}},260);}
canvas.addEventListener('pointerdown',e=>{if(over||thinking)return;if(modeEl.value==='ai'&&turn!==Number(sideEl.value))return;const r=canvas.getBoundingClientRect(),px=(e.clientX-r.left)*canvas.width/r.width,py=(e.clientY-r.top)*canvas.height/r.height,x=Math.round((px-pad)/cell),y=Math.round((py-pad)/cell);if(!inBoard(x,y)||board[y][x])return;if(place(x,y,turn)&&modeEl.value==='ai'&&!over)scheduleAi();});modeEl.onchange=reset;sideEl.onchange=reset;document.querySelector('#reset').onclick=reset;reset();
</script>
</body>
</html>
