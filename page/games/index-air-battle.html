<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>飞机大战 · MinOS-WJ</title>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--line:#dfe4ea;--text:#1f2937;--muted:#667085;--brand:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:700px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between}.top a{color:var(--brand);text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:20px}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}.score{font-weight:600}.score small{display:block;color:var(--muted);font-weight:400}canvas{display:block;width:min(100%,420px);aspect-ratio:3/4;margin:16px auto;background:#0f172a;border-radius:8px;touch-action:none}button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.hint{color:var(--muted);font-size:13px;text-align:center;margin-bottom:0}
</style>
</head>
<body>
<main class="wrap"><div class="top"><a href="../../index.html">← 返回小游戏</a><strong>飞机大战</strong></div><section class="panel"><div class="bar"><span class="score" id="score">得分 0<small id="stats">生命 3 · 关卡 1</small></span><div><button id="pause">暂停</button><button class="primary" id="reset">重新开始</button></div></div><canvas id="game" width="360" height="480"></canvas><p class="hint">方向键 / WASD 移动，Shift 加速，空格连续射击；触屏拖动战机。</p></section></main>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score'),stats=document.querySelector('#stats'),pauseBtn=document.querySelector('#pause');let player,bullets,enemies,enemyBullets,score,lives,level,run,paused,raf,last,spawn,shot,dragging=false;const keys=new Set();
function clearInput(){keys.clear();dragging=false;}function reset(){clearTimeout(raf);clearInput();player={x:180,y:430};bullets=[];enemies=[];enemyBullets=[];score=0;lives=3;level=1;run=true;paused=false;last=0;spawn=0;shot=0;pauseBtn.textContent='暂停';cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);update();}
function update(){scoreEl.firstChild.textContent='得分 '+score;stats.textContent='生命 '+lives+' · 关卡 '+level;}
function fire(){if(run&&!paused&&shot<=0){bullets.push({x:player.x,y:player.y-20});shot=150;}}
function hit(){lives--;player.x=180;player.y=430;update();if(lives<=0){run=false;clearInput();scoreEl.firstChild.textContent='游戏结束 · '+score+' 分';draw();}}
function loop(t){if(!run)return;raf=requestAnimationFrame(loop);if(paused){draw();return;}const dt=Math.min(32,t-last||16);last=t;spawn+=dt;shot-=dt;level=1+Math.floor(score/100);if(spawn>Math.max(250,620-level*35)){spawn=0;enemies.push({x:20+Math.random()*320,y:-20,v:1.2+Math.random()*1.5+level*.15,hp:1+Math.floor(level/5)});}const speed=dt*.32*(keys.has('ShiftLeft')||keys.has('ShiftRight')?1.65:1);if(keys.has('ArrowLeft')||keys.has('KeyA'))player.x-=speed;if(keys.has('ArrowRight')||keys.has('KeyD'))player.x+=speed;if(keys.has('ArrowUp')||keys.has('KeyW'))player.y-=speed;if(keys.has('ArrowDown')||keys.has('KeyS'))player.y+=speed;if(keys.has('Space'))fire();player.x=Math.max(18,Math.min(342,player.x));player.y=Math.max(40,Math.min(455,player.y));bullets.forEach(b=>b.y-=dt*.7);bullets=bullets.filter(b=>b.y>-20);enemies.forEach(e=>{e.y+=e.v*dt*.06;if(Math.random()<.003*level)enemyBullets.push({x:e.x,y:e.y+12,v:dt*.25});});enemyBullets.forEach(b=>b.y+=b.v);enemyBullets=enemyBullets.filter(b=>b.y<500);for(const e of enemies){if(Math.hypot(e.x-player.x,e.y-player.y)<24){e.y=600;hit();}}for(const b of enemyBullets){if(Math.hypot(b.x-player.x,b.y-player.y)<18){b.y=600;hit();}}for(let i=enemies.length-1;i>=0;i--)for(let j=bullets.length-1;j>=0;j--)if(Math.hypot(enemies[i].x-bullets[j].x,enemies[i].y-bullets[j].y)<18){enemies[i].hp--;bullets.splice(j,1);if(enemies[i].hp<=0){enemies.splice(i,1);score+=10;update();}break;}enemies=enemies.filter(e=>e.y<520);draw();}
function draw(){ctx.fillStyle='#0f172a';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='rgba(148,163,184,.25)';for(let i=0;i<35;i++)ctx.fillRect((i*83)%360,(i*47+Date.now()/14)%480,2,2);ctx.fillStyle='#60a5fa';ctx.beginPath();ctx.moveTo(player.x,player.y-18);ctx.lineTo(player.x-15,player.y+18);ctx.lineTo(player.x,player.y+10);ctx.lineTo(player.x+15,player.y+18);ctx.closePath();ctx.fill();ctx.fillStyle='#fbbf24';bullets.forEach(b=>ctx.fillRect(b.x-2,b.y-9,4,12));ctx.fillStyle='#f97316';enemyBullets.forEach(b=>ctx.fillRect(b.x-2,b.y,4,8));enemies.forEach(e=>{ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(e.x,e.y,15,0,Math.PI*2);ctx.fill();});if(paused&&run){ctx.fillStyle='rgba(15,23,42,.7)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.font='bold 26px system-ui';ctx.textAlign='center';ctx.fillText('已暂停',180,240);}}
function toggle(){if(!run)return;paused=!paused;pauseBtn.textContent=paused?'继续':'暂停';if(paused)clearInput();draw();}
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','ShiftLeft','ShiftRight'].includes(e.code))e.preventDefault();if(e.code==='KeyP'){toggle();return;}keys.add(e.code);if(e.code==='Space')fire();});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',clearInput);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInput();});
function movePointer(e){const r=canvas.getBoundingClientRect();player.x=Math.max(18,Math.min(342,(e.clientX-r.left)*canvas.width/r.width));player.y=Math.max(40,Math.min(455,(e.clientY-r.top)*canvas.height/r.height));}canvas.addEventListener('pointerdown',e=>{if(!run||paused)return;dragging=true;canvas.setPointerCapture?.(e.pointerId);movePointer(e);fire();});canvas.addEventListener('pointermove',e=>{if(dragging)movePointer(e);});canvas.addEventListener('pointerup',()=>{dragging=false;});canvas.addEventListener('pointercancel',()=>{dragging=false;});pauseBtn.onclick=toggle;document.querySelector('#reset').onclick=reset;reset();
</script>
</body>
</html>
