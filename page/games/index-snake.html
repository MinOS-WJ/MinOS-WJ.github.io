<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>贪吃蛇 · MinOS-WJ</title><style>:root{--bg:#f5f7fa;--panel:#fff;--line:#dfe4ea;--text:#1f2937;--muted:#667085;--brand:#2563eb;--soft:#eef4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:720px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between}.top a{color:var(--brand);text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:20px}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.score{font-weight:600}.score small{color:var(--muted);font-weight:400}canvas{display:block;width:min(100%,560px);aspect-ratio:1;margin:16px auto;background:#0f172a;border-radius:8px;touch-action:none}button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.controls{display:flex;justify-content:center;gap:8px;margin-top:12px}.controls button{width:46px}.hint{color:var(--muted);font-size:13px;text-align:center;margin-bottom:0}</style></head><body><main class="wrap"><div class="top"><a href="../../index.html">← 返回小游戏</a><strong>贪吃蛇</strong></div><section class="panel"><div class="bar"><span class="score" id="score">得分 0 <small id="best">最高 0</small></span><div><button id="pause">暂停</button><button class="primary" id="reset">重新开始</button></div></div><canvas id="game" width="560" height="560"></canvas><div class="controls"><button data-dir="up">↑</button></div><div class="controls"><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><p class="hint">方向键 / WASD 或屏幕按钮控制；暂停时不会计时。</p></section></main><script>const c=document.querySelector('#game'),x=c.getContext('2d'),n=20,cell=c.width/n;let snake,food,dir,next,score,running,paused,timer;const bestKey='minos-snake-best';function best(){return Number(localStorage.getItem(bestKey)||0)}function place(){do{food={x:Math.floor(Math.random()*n),y:Math.floor(Math.random()*n)}}while(snake.some(p=>p.x===food.x&&p.y===food.y));}function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next={x:1,y:0};score=0;running=true;paused=false;document.querySelector('#pause').textContent='暂停';document.querySelector('#best').textContent='最高 '+best();place();clearInterval(timer);timer=setInterval(step,120);draw();}function setDir(xd,yd){if(xd+dir.x===0&&yd+dir.y===0)return;next={x:xd,y:yd};}function step(){if(!running||paused)return;dir=next;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eating=head.x===food.x&&head.y===food.y,body=eating?snake:snake.slice(0,-1);if(head.x<0||head.x>=n||head.y<0||head.y>=n||body.some(p=>p.x===head.x&&p.y===head.y)){running=false;clearInterval(timer);if(score>best())localStorage.setItem(bestKey,score);document.querySelector('#score').innerHTML='游戏结束 · '+score+' 分 <small>最高 '+best()+'</small>';return;}snake.unshift(head);if(eating){score+=10;place();}else snake.pop();document.querySelector('#score').innerHTML='得分 '+score+' <small>最高 '+Math.max(score,best())+'</small>';draw();}function draw(){x.fillStyle='#0f172a';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#1e293b';for(let i=1;i<n;i++){x.beginPath();x.moveTo(i*cell,0);x.lineTo(i*cell,c.height);x.stroke();x.beginPath();x.moveTo(0,i*cell);x.lineTo(c.width,i*cell);x.stroke();}x.fillStyle='#f97316';x.beginPath();x.arc((food.x+.5)*cell,(food.y+.5)*cell,cell*.3,0,Math.PI*2);x.fill();snake.forEach((p,i)=>{x.fillStyle=i?'#60a5fa':'#2563eb';x.fillRect(p.x*cell+3,p.y*cell+3,cell-6,cell-6);});if(paused&&running){x.fillStyle='rgba(15,23,42,.68)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';x.font='bold 26px system-ui';x.textAlign='center';x.fillText('已暂停',c.width/2,c.height/2);}}document.addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};if(m[e.key]){e.preventDefault();setDir(...m[e.key]);}if(e.key==='p')toggle();});function toggle(){if(!running)return;paused=!paused;document.querySelector('#pause').textContent=paused?'继续':'暂停';draw();}document.querySelector('#pause').onclick=toggle;document.querySelector('#reset').onclick=reset;document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};setDir(...m[b.dataset.dir]);});reset();</script></body></html>
